<div class="app-shell">
  <app-sidebar [class.sidebar-host--open]="drawerOpen()" />

  @if (drawerOpen()) {
    <button
      type="button"
      class="nav-scrim"
      tabindex="-1"
      aria-label="Close navigation"
      (click)="drawer.close()"
    ></button>
  }

  <div class="main-area">
    <app-header />
    <main
      class="content-area"
      id="main-content"
      [attr.data-content-width]="contentWidth()"
    >
      <div class="content-width">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

@if (showKitBadge()) {
  <app-kit-badge />
}

<app-command-palette />
