<aside class="sidebar" id="app-nav" aria-label="Main navigation">
  <a class="sidebar-brand" routerLink="/dashboard" aria-label="Leaseting dashboard">
    <app-brand-logo class="[--brand-logo-height:30px]" [decorative]="true" />
  </a>

  <nav class="sidebar-nav">
    @for (section of sections; track section.label) {
      <div class="nav-section" [class.nav-section--apps]="section.type === 'apps'">
        <span class="nav-section-label" aria-hidden="true">{{ section.label }}</span>
        <ul class="nav-list" role="list">
          @for (item of section.items; track item.label) {
            <li>
              @if (item.external) {
                <a
                  class="nav-item nav-item--external"
                  [href]="item.href"
                  target="_blank"
                  rel="noopener noreferrer"
                  [attr.aria-label]="item.label + ', opens in a new tab'"
                >
                  <svg [pIcon]="item.icon" class="nav-icon" [size]="16" aria-hidden="true"></svg>
                  <span class="nav-label">{{ item.label }}</span>
                  <svg pIcon="external-link" class="nav-external-icon" [size]="11" aria-hidden="true"></svg>
                </a>
              } @else {
                <a
                  class="nav-item"
                  [class.nav-item--active]="isActive(item.route)"
                  [routerLink]="item.route"
                  [attr.aria-current]="isActive(item.route) ? 'page' : null"
                >
                  <svg [pIcon]="item.icon" class="nav-icon" [size]="16" aria-hidden="true"></svg>
                  <span class="nav-label">{{ item.label }}</span>
                  @if (item.comingSoon) {
                    <span class="nav-soon">Soon</span>
                  }
                </a>
              }
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <div class="sidebar-bottom">
    <a
      class="nav-item"
      [class.nav-item--active]="isActive(settingsNav.route)"
      [routerLink]="settingsNav.route"
      [attr.aria-current]="isActive(settingsNav.route) ? 'page' : null"
    >
      <svg [pIcon]="settingsNav.icon" class="nav-icon" [size]="16" aria-hidden="true"></svg>
      <span class="nav-label">{{ settingsNav.label }}</span>
    </a>
  </div>
</aside>
