<app-auth-shell>
  <header class="mb-6">
    <h1 class="font-heading text-2xl font-semibold leading-[1.2] tracking-[-0.01em] text-heading">Reset your password</h1>
    <p class="mt-1.5 text-[13.5px] leading-[1.55] text-muted">Self-service reset isn't available yet.</p>
  </header>

  <div class="flex items-start gap-2.5 rounded-base border border-border bg-surface px-3.5 py-3 text-[13px] leading-[1.55] text-body">
    <svg pIcon="lock" class="mt-0.5 shrink-0 text-muted" [size]="16" aria-hidden="true"></svg>
    <span>Ask your workspace administrator to set a new password for your account, then sign in with it.</span>
  </div>

  <a
    class="mt-6 inline-flex items-center gap-1.5 rounded-[2px] text-[13px] font-medium text-primary transition-colors duration-150 ease-out hover:text-primary-hover hover:underline hover:underline-offset-2 motion-reduce:transition-none"
    routerLink="/login"
  >
    <svg pIcon="arrow-left" [size]="14" aria-hidden="true"></svg>
    <span>Back to sign in</span>
  </a>
</app-auth-shell>
