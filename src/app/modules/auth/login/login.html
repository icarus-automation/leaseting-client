<app-auth-layout image="/assets/auth/login-panel.webp">
  <header class="mb-8">
    <h1 class="text-[28px] font-semibold leading-[1.2] tracking-[-0.02em] text-heading">Leaseting</h1>
    <p class="mt-2 text-balance text-sm leading-[1.55] text-muted">
      Property operations, from digital to intelligent systems.
    </p>
  </header>

  @if (errorMessage(); as message) {
    <div
      class="mb-5 flex items-start gap-2.5 rounded-base border border-[color-mix(in_oklab,var(--destructive)_28%,transparent)] bg-muted-destructive px-3 py-2.5 text-[13px] leading-[1.5] text-body animate-error-in motion-reduce:animate-none"
      role="alert"
    >
      <svg pIcon="exclamation-circle" class="mt-[3px] shrink-0 text-destructive" [size]="15" aria-hidden="true"></svg>
      <span>{{ message }}</span>
    </div>
  }

  <app-google-button [loading]="googleLoading()" [disabled]="loading()" (pressed)="continueWithGoogle()" />

  <div class="my-5 flex items-center gap-3" aria-hidden="true">
    <span class="h-px flex-1 bg-border"></span>
    <span class="text-xs text-muted">or</span>
    <span class="h-px flex-1 bg-border"></span>
  </div>

  <form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-heading" for="email">Email</label>
      <input
        #emailInput
        id="email"
        type="email"
        class="auth-input h-11 w-full rounded-base border border-border bg-background px-3 text-base text-body transition-[border-color] duration-150 ease-out placeholder:text-muted hover:border-border-strong aria-[invalid=true]:border-destructive aria-[invalid=true]:[--focus-outline-color:var(--destructive)] motion-reduce:transition-none md:text-sm"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
        placeholder="you@company.com"
        aria-required="true"
        [attr.aria-invalid]="!!emailError()"
        [attr.aria-describedby]="emailError() ? 'email-error' : null"
      />
      @if (emailError(); as message) {
        <p class="text-[12.5px] leading-[1.4] text-destructive" id="email-error">{{ message }}</p>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <div class="flex items-baseline justify-between gap-3">
        <label class="text-[13px] font-medium text-heading" for="password">Password</label>
        <a
          class="rounded-[2px] text-[13px] font-medium text-primary transition-colors duration-150 ease-out hover:text-primary-hover hover:underline hover:underline-offset-2 motion-reduce:transition-none"
          routerLink="/login/forgot-password"
        >Forgot password?</a>
      </div>
      <div class="relative">
        <input
          id="password"
          class="auth-input h-11 w-full rounded-base border border-border bg-background pl-3 pr-12 text-base text-body transition-[border-color] duration-150 ease-out hover:border-border-strong aria-[invalid=true]:border-destructive aria-[invalid=true]:[--focus-outline-color:var(--destructive)] motion-reduce:transition-none md:text-sm"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          aria-required="true"
          [attr.aria-invalid]="!!passwordError()"
          [attr.aria-describedby]="passwordError() ? 'password-error' : null"
        />
        <button
          type="button"
          class="absolute right-1 top-1 flex h-9 w-9 items-center justify-center rounded-base border-none bg-transparent p-0 text-muted transition-colors duration-150 ease-out [--focus-outline-offset:0px] hover:bg-surface hover:text-body motion-reduce:transition-none"
          aria-label="Show password"
          aria-controls="password"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePassword()"
        >
          <svg [pIcon]="showPassword() ? 'eye-slash' : 'eye'" [size]="16" aria-hidden="true"></svg>
        </button>
      </div>
      @if (passwordError(); as message) {
        <p class="text-[12.5px] leading-[1.4] text-destructive" id="password-error">{{ message }}</p>
      }
    </div>

    <button
      type="submit"
      class="mt-1 inline-flex h-11 w-full items-center justify-center gap-2 rounded-base border-none bg-primary text-sm font-semibold text-primary-foreground transition-colors duration-150 ease-out enabled:hover:bg-primary-hover enabled:active:bg-primary-active disabled:cursor-not-allowed disabled:bg-primary-active motion-reduce:transition-none"
      [disabled]="loading()"
      [attr.aria-busy]="loading() ? 'true' : null"
    >
      @if (loading()) {
        <p-progress-spinner class="h-[15px] w-[15px] m-0 text-primary-foreground" strokeWidth="6" animationDuration=".65s" aria-hidden="true" />
        <span>Signing in…</span>
      } @else {
        <span>Sign in</span>
      }
    </button>
  </form>
</app-auth-layout>
