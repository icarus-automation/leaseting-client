@if (items().length > 0) {
  <button
    type="button"
    class="inline-flex h-9 items-center gap-2 rounded-base border border-border bg-background px-3.5 text-[13px] font-medium text-body transition-colors duration-150 ease-out hover:bg-surface motion-reduce:transition-none"
    aria-haspopup="menu"
    aria-controls="generate-menu"
    [attr.aria-expanded]="open()"
    (click)="toggle($event)"
  >
    <span>Generate</span>
    <svg pIcon="chevron-down" [size]="12" aria-hidden="true"></svg>
  </button>

  <p-menu
    #menu
    id="generate-menu"
    [model]="items()"
    [popup]="true"
    appendTo="body"
    (onShow)="open.set(true)"
    (onHide)="open.set(false)"
  >
    <ng-template #item let-item>
      @if (item.routerLink) {
        <a
          class="flex items-center gap-2 px-3 py-2 text-[13px] text-body no-underline"
          tabindex="-1"
          [routerLink]="item.routerLink"
        >
          <svg [pIcon]="iconOf(item)" [size]="14" aria-hidden="true"></svg>
          <span>{{ item.label }}</span>
        </a>
      } @else {
        <button type="button" class="flex w-full items-center gap-2 px-3 py-2 text-left text-[13px] text-body" tabindex="-1">
          <svg [pIcon]="iconOf(item)" [size]="14" aria-hidden="true"></svg>
          <span>{{ item.label }}</span>
        </button>
      }
    </ng-template>
  </p-menu>
}
