<app-form-dialog
  #dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  heading="Reset password"
  [subheading]="member()?.name ?? null"
  [dirty]="errors.dirty()"
  width="30rem"
>
  @if (errorMessage(); as message) {
    <app-error-banner class="mb-4" [message]="message" />
  }

  <form id="attendant-password-form" class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="text-[13px] leading-relaxed text-body">
      Every handheld signed in as {{ member()?.name }} is signed out and has to use the new password.
    </p>

    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-heading" for="attendant-password-new">New password</label>
      <input
        id="attendant-password-new"
        type="text"
        formControlName="password"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        [placeholder]="minPasswordLength + '+ characters'"
        class="h-10 rounded-base border border-border bg-background px-3 text-sm text-body outline-none transition-[border-color,box-shadow] duration-150 ease-out placeholder:text-muted focus:border-primary focus:ring-[3px] focus:ring-ring aria-[invalid=true]:border-destructive motion-reduce:transition-none"
        aria-required="true"
        [attr.aria-invalid]="!!errors.fieldError('password', passwordMessages)"
        [attr.aria-describedby]="errors.fieldError('password', passwordMessages) ? 'attendant-password-error' : null"
      />
      @if (errors.fieldError('password', passwordMessages); as message) {
        <p class="text-[12.5px] text-destructive" id="attendant-password-error">{{ message }}</p>
      }
    </div>
  </form>

  <ng-container dialog-footer>
    <button
      type="button"
      class="inline-flex h-9 items-center rounded-base border border-border bg-background px-3.5 text-[13px] font-medium text-body transition-colors duration-150 ease-out hover:bg-surface motion-reduce:transition-none"
      (click)="dialog.requestClose()"
    >
      Cancel
    </button>
    <button
      type="submit"
      form="attendant-password-form"
      class="inline-flex h-9 items-center gap-2 rounded-base border-none bg-primary px-3.5 text-[13px] font-semibold text-primary-foreground transition-colors duration-150 ease-out enabled:hover:bg-primary-hover enabled:active:bg-primary-active disabled:cursor-not-allowed disabled:opacity-[0.65] motion-reduce:transition-none"
      [disabled]="saving()"
      [attr.aria-busy]="saving() ? 'true' : null"
    >
      @if (saving()) {
        <p-progress-spinner class="h-3.5 w-3.5 m-0 text-primary-foreground" strokeWidth="6" animationDuration=".65s" aria-hidden="true" />
        <span>Resetting…</span>
      } @else {
        <span>Reset password</span>
      }
    </button>
  </ng-container>
</app-form-dialog>
