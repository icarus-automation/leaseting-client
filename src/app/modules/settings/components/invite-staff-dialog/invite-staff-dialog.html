<app-form-dialog
  #dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  heading="Invite staff"
  subheading="They get an email with a link to join. The link works for 7 days."
  [dirty]="errors.dirty()"
  width="32rem"
>
  @if (errorMessage(); as message) {
    <app-error-banner class="mb-4" [message]="message" />
  }

  <form id="invite-staff-form" class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-heading" for="invite-email">Email</label>
      <input
        id="invite-email"
        type="email"
        formControlName="email"
        autocomplete="off"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
        placeholder="name@company.com"
        class="h-10 rounded-base border border-border bg-background px-3 text-sm text-body outline-none transition-[border-color,box-shadow] duration-150 ease-out placeholder:text-muted focus:border-primary focus:ring-[3px] focus:ring-ring aria-[invalid=true]:border-destructive motion-reduce:transition-none"
        aria-required="true"
        [attr.aria-invalid]="!!errors.fieldError('email', emailMessages)"
        [attr.aria-describedby]="errors.fieldError('email', emailMessages) ? 'invite-email-error' : null"
      />
      @if (errors.fieldError('email', emailMessages); as message) {
        <p class="text-[12.5px] text-destructive" id="invite-email-error">{{ message }}</p>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-heading" for="invite-role">Role</label>
      <p-select
        inputId="invite-role"
        formControlName="role"
        [options]="roleGroups()"
        [group]="true"
        optionGroupLabel="label"
        optionGroupChildren="items"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        appendTo="body"
      />
      <p class="text-[12.5px] leading-relaxed text-muted" id="invite-role-description">
        {{ selectedRole()?.description ?? 'Pick the role they get when they join.' }}
      </p>
      @if (rolesError(); as message) {
        <p class="text-[12px] text-muted">
          {{ message }} Only Member and Admin are listed.
          <button type="button" class="font-medium text-primary hover:underline" (click)="loadRoles()">Try again</button>
        </p>
      }
    </div>

    <app-property-access-picker
      formControlName="propertyAccess"
      idPrefix="invite"
      [error]="errors.fieldError('propertyAccess', propertyMessages)"
    />
  </form>

  <ng-container dialog-footer>
    <button
      type="button"
      class="inline-flex h-9 items-center rounded-base border border-border bg-background px-3.5 text-[13px] font-medium text-body transition-colors duration-150 ease-out hover:bg-surface motion-reduce:transition-none"
      (click)="dialog.requestClose()"
    >
      Cancel
    </button>
    <button
      type="submit"
      form="invite-staff-form"
      class="inline-flex h-9 items-center gap-2 rounded-base border-none bg-primary px-3.5 text-[13px] font-semibold text-primary-foreground transition-colors duration-150 ease-out enabled:hover:bg-primary-hover enabled:active:bg-primary-active disabled:cursor-not-allowed disabled:opacity-[0.65] motion-reduce:transition-none"
      [disabled]="saving()"
      [attr.aria-busy]="saving() ? 'true' : null"
    >
      @if (saving()) {
        <p-progress-spinner class="h-3.5 w-3.5 m-0 text-primary-foreground" strokeWidth="6" animationDuration=".65s" aria-hidden="true" />
        <span>Sending…</span>
      } @else {
        <span>Send invitation</span>
      }
    </button>
  </ng-container>
</app-form-dialog>
