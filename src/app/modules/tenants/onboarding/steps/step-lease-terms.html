<form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="submit()">
  @if (errorMessage(); as message) {
    <p class="rounded-base border border-destructive/30 bg-muted-destructive px-3 py-2 text-[13px] text-destructive">
      {{ message }}
    </p>
  }

  <section class="flex flex-col gap-2">
    <div>
      <h3 class="text-[13px] font-medium text-heading">What are the rent charges?</h3>
      <p class="mt-0.5 text-[12.5px] text-muted">
        Everything billed every month. Manage the list of charges in Settings → Charge items.
      </p>
    </div>
    <app-charge-lines
      [lines]="charges"
      [busy]="busy()"
      addLabel="Add another charge"
      emptyMessage="No rent charges yet — add the first one."
    />
  </section>

  <section class="flex flex-col gap-2 border-t border-border pt-4">
    <label class="text-[13px] font-medium text-heading" for="ob-due-day">When is rent due?</label>
    <div class="flex flex-wrap items-center gap-2">
      <p-inputnumber
        inputId="ob-due-day"
        formControlName="dueDay"
        [min]="1"
        [max]="31"
        [showButtons]="true"
        styleClass="w-28"
        inputStyleClass="w-full"
      />
      <span class="text-[13px] text-muted">every {{ dueDayLabel() }} of the month</span>
    </div>
  </section>

  <!-- The figure the lease is written with, and what the rent run bills. -->
  <div class="flex flex-wrap items-center justify-between gap-2 rounded-base border border-border bg-surface px-4 py-3">
    <span class="text-[11.5px] font-medium uppercase tracking-wide text-muted">Monthly rent</span>
    <span class="font-heading text-[17px] font-semibold text-heading">{{ monthlyTotal() | phpCurrency }}</span>
  </div>

  <div class="flex items-center justify-between border-t border-border pt-4">
    <button
      type="button"
      class="inline-flex h-9 items-center gap-2 rounded-base border border-border bg-background px-3.5 text-[13px] font-medium text-body transition-colors duration-150 ease-out hover:bg-surface motion-reduce:transition-none"
      (click)="back.emit()"
    >
      <svg pIcon="arrow-left" [size]="12" aria-hidden="true"></svg>
      <span>Back</span>
    </button>
    <button
      type="submit"
      class="inline-flex h-9 items-center gap-2 rounded-base border-none bg-primary px-4 text-[13px] font-semibold text-primary-foreground transition-colors duration-150 ease-out enabled:hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-[0.65] motion-reduce:transition-none"
      [disabled]="busy()"
    >
      <span>{{ busy() ? 'Saving…' : 'Next: Deposit' }}</span>
      @if (!busy()) {
        <svg pIcon="arrow-right" [size]="12" aria-hidden="true"></svg>
      }
    </button>
  </div>
</form>
